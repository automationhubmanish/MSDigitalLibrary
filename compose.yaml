services:
  library:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /app/data/library.sqlite
    volumes:
      - library-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  library-data:
